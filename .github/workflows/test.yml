name: test
on: [push, pull_request]

jobs:
  neovim:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        version: [v0.11.0, stable]
    steps:
      - uses: actions/checkout@v5
      - uses: rhysd/action-setup-vim@v1
        with:
          version: ${{ matrix.version }}
          neovim: true
      - run: ./tests/install-parsers.sh "$RUNNER_TEMP/pairs-parsers"
      - run: ./tests/run.sh
        env:
          PAIRS_TEST_PARSER_ROOT: ${{ runner.temp }}/pairs-parsers
      - run: ./tests/bench.sh
        env:
          PAIRS_TEST_PARSER_ROOT: ${{ runner.temp }}/pairs-parsers
          PAIRS_BENCH_SAMPLES: 100
          PAIRS_BENCH_LINES: 1000
          PAIRS_BENCH_MAPPED_SAMPLES: 5
          PAIRS_BENCH_OUTPUT: ${{ runner.temp }}/pairs-benchmark.json

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: JohnnyMorganz/stylua-action@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: v2.1.0
          args: --check lua tests plugin
